# Authelia configuration for docker-seedbox (pinned image: see compose.yaml).
#
# Values in {{ env "..." }} are filled in by Authelia's own template filter
# (X_AUTHELIA_CONFIG_FILTERS=template) from the environment set in compose.yaml / .env.
# Secrets are NOT in this file: they come from AUTHELIA_*_SECRET / *_KEY environment
# variables generated by setup.sh.
# Reference: https://www.authelia.com/configuration/prologue/introduction/
---
theme: 'auto'

server:
  address: 'tcp://:9091/'

log:
  level: 'info'

# Do not refuse to boot on hosts that cannot reach an NTP server.
ntp:
  disable_failure: true

authentication_backend:
  file:
    path: '/users/users_database.yml'
    watch: true            # new users added by `./setup.sh add-user` apply without a restart
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ env "APP_HOST" }}'
      policy: '{{ env "AUTH_POLICY" }}'   # one_factor (default) | two_factor

session:
  name: 'seedbox_session'
  same_site: 'lax'
  inactivity: '12h'
  expiration: '24h'
  remember_me: '30d'
  cookies:
    - domain: '{{ env "COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_HOST" }}'
      default_redirection_url: 'https://{{ env "APP_HOST" }}'

regulation:
  max_retries: 5
  find_time: '5m'
  ban_time: '15m'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
