# Authelia configuration for docker-seedbox (pinned image: see compose.yaml).
#
# Values in {{ env "..." }} are filled in by Authelia's own template filter
# (X_AUTHELIA_CONFIG_FILTERS=template) from the environment set in compose.yaml / .env.
# Secrets are NOT in this file: they come from AUTHELIA_*_SECRET / *_KEY environment
# variables generated by setup.sh.
# Reference: https://www.authelia.com/configuration/prologue/introduction/
#
# Layout (the same rule the gateway and the API apply):
#   AUTH_HOST empty or equal to APP_HOST -> single domain: the portal is https://APP_HOST/auth/ and the session cookie
#                                           is scoped to COOKIE_DOMAIN (default: APP_HOST itself).
#   AUTH_HOST another hostname           -> separate login host https://AUTH_HOST/ (cookie: COOKIE_DOMAIN, a parent of
#                                           both hosts) - exactly the configuration used before single-domain support.
{{- $app := env "APP_HOST" | lower }}
{{- $auth := env "AUTH_HOST" | lower }}
{{- $same := or (eq $auth "") (eq $auth $app) }}
---
theme: 'auto'

server:
  # Single domain: Authelia strips the one-segment subpath itself (the gateway passes /auth/... unchanged) and keeps
  # answering on / too, which the gateway's internal auth_request (/api/authz/auth-request) uses.
  address: 'tcp://:9091/{{ if $same }}auth{{ end }}'

log:
  level: 'info'

# Do not refuse to boot on hosts that cannot reach an NTP server.
ntp:
  disable_failure: true

authentication_backend:
  file:
    path: '/users/users_database.yml'
    watch: true            # new users added by `./setup.sh add-user` apply without a restart
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ $app }}'
      policy: '{{ env "AUTH_POLICY" }}'   # one_factor (default) | two_factor

session:
  name: 'seedbox_session'
  same_site: 'lax'
  inactivity: '12h'
  expiration: '24h'
  remember_me: '30d'
  cookies:
    - domain: '{{ if $same }}{{ env "COOKIE_DOMAIN" | default $app }}{{ else }}{{ env "COOKIE_DOMAIN" }}{{ end }}'
      authelia_url: 'https://{{ if $same }}{{ $app }}/auth/{{ else }}{{ $auth }}{{ end }}'
      default_redirection_url: 'https://{{ $app }}'

regulation:
  max_retries: 5
  find_time: '5m'
  ban_time: '15m'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
