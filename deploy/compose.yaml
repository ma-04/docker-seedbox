# docker-seedbox - main stack. Normally driven by ./setup.sh, which writes deploy/.env
# (including COMPOSE_FILE, which selects the reverse-proxy override), so from this directory:
#
#   docker compose up -d
#
# Images: pre-built from GHCR by default; `docker compose build` builds them from this clone.
# Docs: docs/deployment.md, docs/configuration.md

name: seedbox   # override with COMPOSE_PROJECT_NAME

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  APP_SECRET: ${APP_SECRET:?run ./setup.sh to generate secrets}
  GATEWAY_SECRET: ${GATEWAY_SECRET:?run ./setup.sh to generate secrets}
  VPN_CONTROL_TOKEN: ${VPN_CONTROL_TOKEN:?run ./setup.sh to generate secrets}
  APP_HOST: ${APP_HOST:?APP_HOST is required}
  AUTH_HOST: ${AUTH_HOST:-}         # empty = login portal at APP_HOST/auth/ (single domain)
  FILES_HOST: ${FILES_HOST:-}       # empty = downloads at APP_HOST/dl/ (single domain)
  AUTH_MODE: ${AUTH_MODE:-authelia}
  LOGOUT_URL: ${LOGOUT_URL:-}       # AUTH_MODE=external only: your SSO's sign-out page (empty = no "Log out" link)
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  ADMIN_GROUP: ${ADMIN_GROUP:-admins}
  DATA_DIR: /data
  DOWNLOADS_DIR: /downloads
  QBT_URL: http://vpn:8080
  VPN_URL: http://vpn:8000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HOME: /tmp          # rclone cache dir; the root filesystem is read-only

services:
  # ---------------------------------------------------------------- init
  # One-shot, root: makes the named volumes writable by the unprivileged (uid 1000) services on
  # first start, whichever container happens to touch a volume first. `library` is world-readable
  # (the gateway runs as nginx, uid 101, and serves it read-only).
  init:
    image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /downloads/incomplete /downloads/library
        chown 1000:1000 /data /downloads /downloads/incomplete /downloads/library
        chmod 755 /downloads /downloads/library
    volumes:
      - data:/data
      - downloads:/downloads
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # ---------------------------------------------------------------- gateway
  # The only entrypoint. Routes by Host (and /auth/, /dl/ on APP_HOST in the single-domain layout), enforces login,
  # serves local downloads.
  # The proxy override file (compose.proxy-*.yaml) decides how it is exposed.
  gateway:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-gateway:${SEEDBOX_VERSION:-latest}
    build: { context: ../services/gateway }
    restart: unless-stopped
    environment:
      AUTH_MODE: ${AUTH_MODE:-authelia}
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      AUTH_HOST: ${AUTH_HOST:-}
      FILES_HOST: ${FILES_HOST:-}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?run ./setup.sh to generate secrets}
    volumes:
      - type: volume                    # only the delivered files, read-only (never incomplete/)
        source: downloads
        target: /downloads/library
        read_only: true
        volume: { subpath: library }
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging

  # ---------------------------------------------------------------- authelia
  # Login portal (AUTH_MODE=authelia). Not started when COMPOSE_PROFILES lacks "authelia".
  authelia:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    profiles: ["authelia"]
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      AUTH_HOST: ${AUTH_HOST:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}   # empty = APP_HOST (single domain); see authelia/configuration.yml
      AUTH_POLICY: ${AUTH_POLICY:-one_factor}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?run ./setup.sh to generate secrets}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?run ./setup.sh to generate secrets}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?run ./setup.sh to generate secrets}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users:/users          # users_database.yml lives here (setup.sh add-user)
      - authelia:/data                   # SQLite + notification.txt
    security_opt: ["no-new-privileges:true"]
    # The image entrypoint starts as root, chowns its config and drops to PUID/PGID with su-exec (SETUID/SETGID);
    # DAC_OVERRIDE/FOWNER let that root read and rewrite users_database.yml, which setup.sh keeps at mode 600 and
    # owned by whoever ran it.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    logging: *logging

  # ---------------------------------------------------------------- web
  web:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-web:${SEEDBOX_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Footer: version + source link (AGPL). setup.sh sets SEEDBOX_BUILD_VERSION for local builds.
        VITE_APP_VERSION: ${SEEDBOX_BUILD_VERSION:-dev}
        VITE_SOURCE_URL: ${SEEDBOX_SOURCE_URL:-https://github.com/ma-04/docker-seedbox}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # ---------------------------------------------------------------- api
  api:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-api:${SEEDBOX_VERSION:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
      # Torrent search (optional, ./setup.sh --search): empty SEARCH_BACKEND = off. Jackett runs in the vpn namespace.
      SEARCH_BACKEND: ${SEARCH_BACKEND:-}
      JACKETT_URL: http://vpn:9117
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      FLARESOLVERR_ENABLED: ${FLARESOLVERR_ENABLED:-}
    volumes:
      - data:/data
      - type: volume                    # only for the local-destination "Test" (mkdir + write probe in library/)
        source: downloads
        target: /downloads/library
        volume: { subpath: library }
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      init: { condition: service_completed_successfully }
    networks:
      default:
        ipv4_address: ${API_IP:-172.31.250.3}      # static: qBittorrent's WebUI trusts exactly this address (QBT_TRUSTED_IPS)
    healthcheck:
      # /api/health needs the gateway secret like every other request.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{'x-gateway-secret':process.env.GATEWAY_SECRET}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # ---------------------------------------------------------------- worker
  # Same image as api; drives qBittorrent, runs rclone uploads, rotates the VPN.
  worker:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-api:${SEEDBOX_VERSION:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - data:/data
      - downloads:/downloads
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      default:
        ipv4_address: ${WORKER_IP:-172.31.250.4}   # static: qBittorrent's WebUI trusts exactly this address (QBT_TRUSTED_IPS)
    depends_on:
      init: { condition: service_completed_successfully }
      api: { condition: service_healthy }
      qbittorrent: { condition: service_healthy }
    logging: *logging

  # ================================================================ BEGIN vpn
  # Owned by services/vpn (see its README) - keep in sync with that image's requirements.
  # WireGuard client + kill switch + control API; owns the network namespace of qbittorrent.
  vpn:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-vpn:${SEEDBOX_VERSION:-latest}
    build: { context: ../services/vpn }
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]              # the only capability kept (kernel WireGuard + nftables, Linux >= 5.6)
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    environment:
      VPN_CONTROL_TOKEN: ${VPN_CONTROL_TOKEN:?run ./setup.sh to generate secrets}
      LAN_CIDRS: ${LAN_CIDRS:-172.31.250.0/24}
      CONTROL_TRUSTED_IPS: ${API_IP:-172.31.250.3},${WORKER_IP:-172.31.250.4}   # only api and worker may reach the control API :8000
      VPN_DEFAULT_MODE: ${VPN_DEFAULT_MODE:-required}   # fail closed after any restart until the worker applies vpn.mode
      VPN_MTU: ${VPN_MTU:-}              # empty = 1280 unless the WireGuard config sets MTU =; see docs/configuration.md
      # Torrent search: only the api may open connections to Jackett (:9117); FlareSolverr (:8191) is loopback-only.
      # Both stay closed to everything else whether or not the "search" profiles run.
      SEARCH_TRUSTED_IPS: ${API_IP:-172.31.250.3}
      SEARCH_PORT: "9117"
      LOCAL_ONLY_PORTS: "8191"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs: ["/tmp"]                   # not read_only: /etc/resolv.conf must stay writable
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        ipv4_address: ${VPN_IPV4:-172.31.250.2}   # static, inside LAN_CIDRS (the kill switch allows that subnet)
    healthcheck:                      # also built into the image; shown for completeness
      test: ["CMD", "/usr/local/bin/vpn-control", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
    logging: *logging
  # ================================================================ END vpn

  # ================================================================ BEGIN qbittorrent
  # Owned by services/qbittorrent (wraps the official qbittorrent-nox image).
  # Shares the vpn container's network namespace: no VPN, no traffic. No ports, no networks.
  qbittorrent:
    image: ${SEEDBOX_REGISTRY:-ghcr.io/ma-04}/docker-seedbox-qbittorrent:${SEEDBOX_VERSION:-latest}
    build: { context: ../services/qbittorrent }
    restart: unless-stopped
    network_mode: service:vpn
    environment:
      LAN_CIDRS: ${LAN_CIDRS:-172.31.250.0/24}
      # Only api and worker may use the WebUI without a password; everything else in the network must authenticate.
      QBT_TRUSTED_IPS: ${API_IP:-172.31.250.3},${WORKER_IP:-172.31.250.4}
    volumes:
      - qbt-config:/config
      - type: volume                    # qBittorrent sees only incomplete/, never library/ (the delivered files of every user)
        source: downloads
        target: /downloads/incomplete
        volume: { subpath: incomplete }
    security_opt: ["no-new-privileges:true"]
    # The entrypoint starts as root only to chown the /config volume's top directory (non-recursively) and then drops to
    # PUID/PGID (1000): seeding qBittorrent.conf and qBittorrent itself run unprivileged, so a symlink planted in /config
    # by a compromised qBittorrent cannot be followed by root. No DAC_OVERRIDE/FOWNER: root cannot write inside /config.
    # read_only: the entrypoint and the rest of the rootfs cannot be replaced; qBittorrent writes only /config, the
    # incomplete/ subpath and /tmp.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]   # KILL: tini (root) must be able to forward SIGTERM to qbittorrent (uid 1000) so it saves resume data on stop
    depends_on:
      init: { condition: service_completed_successfully }
      vpn:
        condition: service_healthy
        restart: true                 # re-attach to the new namespace when vpn is recreated/restarted
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/v2/app/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
  # ================================================================ END qbittorrent

  # ================================================================ BEGIN search (optional: ./setup.sh --search)
  # Jackett (torrent search) in the vpn container's network namespace like qbittorrent: every tracker-site query goes
  # through the tunnel or nowhere. The kill switch lets only the api container connect to :9117; admins reach Jackett's own
  # UI at https://APP_HOST/jackett/ through the api (admin-only passthrough). Upstream image, pinned by digest, run as
  # uid 1000 without s6/root, with a read-only root filesystem and no capabilities.
  jackett-init:   # one-shot, root: the config volume must belong to uid 1000 before Jackett (not root) starts
    image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    profiles: ["search"]
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /config/Jackett && chown -h 1000:1000 /config /config/Jackett"]
    volumes:
      - jackett-config:/config
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  jackett:
    image: lscr.io/linuxserver/jackett:0.24.3047@sha256:f311762e5549286f71c281f2772125908e5fce73a28445b3f28d01bcf579c867
    profiles: ["search"]
    restart: unless-stopped
    network_mode: service:vpn
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/seedbox/entrypoint.sh"]
    environment:
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}            # required when the profile runs; the entrypoint refuses an empty one
      FLARESOLVERR_URL: ${JACKETT_FLARESOLVERR_URL:-}   # http://127.0.0.1:8191 with the "search-flaresolverr" profile
      HOME: /tmp
      TMPDIR: /tmp
    volumes:
      - ./jackett/entrypoint.sh:/seedbox/entrypoint.sh:ro
      - type: volume                    # nocopy: the image's root-owned /config must not be copied over the volume
        source: jackett-config
        target: /config
        volume: { nocopy: true }
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      jackett-init: { condition: service_completed_successfully }
      vpn:
        condition: service_healthy
        restart: true                 # re-attach to the new namespace when vpn is recreated/restarted
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9117/jackett/UI/Login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # FlareSolverr (optional, off by default: ./setup.sh --flaresolverr): headless Chromium that solves Cloudflare challenges
  # for Jackett. Same namespace; listens on 127.0.0.1:8191 only and the kill switch keeps that port loopback-only, so only
  # Jackett can use it. Not read-only: it patches its chromedriver binary at start.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    profiles: ["search-flaresolverr"]
    restart: unless-stopped
    network_mode: service:vpn
    environment:
      HOST: 127.0.0.1
      PORT: "8191"
      LOG_LEVEL: info
    tmpfs: ["/tmp"]
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
  # ================================================================ END search

networks:
  default:
    ipam:
      config:
        - subnet: ${LAN_CIDRS:-172.31.250.0/24}
          ip_range: ${LAN_IP_RANGE:-172.31.250.128/25}   # dynamic addresses; the low half is reserved for vpn/api/worker

volumes:
  data:
  downloads:
  authelia:
  qbt-config:
  jackett-config:
