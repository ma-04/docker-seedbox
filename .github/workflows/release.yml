name: Release images

# Publishes the five images to GHCR as ghcr.io/<owner>/docker-seedbox-<name>. See docs/releasing.md.
#
#   tag vX.Y.Z        -> :X.Y.Z, :X.Y and :latest
#   tag vX.Y.Z-rc.N   -> :X.Y.Z-rc.N only (a pre-release never moves :X.Y or :latest)
#   push to main      -> :edge only
#   workflow_dispatch -> same rules, for the ref it is run on (a tag or main; anything else is refused)
#
# Nothing is tagged until (1) the whole CI suite (ci.yml, including the e2e job) is green for this exact commit and
# (2) all five images were built and pushed (untagged, by digest). Only then one job applies the tags to all five at
# once, so a red or partial build cannot leave a mixed set of images under :latest / :X.Y.Z.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: Check the ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.ref.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ref
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" = refs/heads/main ]; then
            echo "kind=edge" >> "$GITHUB_OUTPUT"
          elif [ "${REF#refs/tags/}" != "$REF" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '$REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
            fi
            # A release must be a commit that is on main (it has gone through review and CI there).
            # fetch-depth: 0 above already fetched every branch, so origin/main exists (no credentials needed here).
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag '$REF_NAME' points at a commit that is not on main"; exit 1
            fi
            case "$REF_NAME" in *-*) echo "kind=prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "kind=release" >> "$GITHUB_OUTPUT" ;; esac
          else
            echo "::error::only tags (vX.Y.Z) and main can be published, not $REF"; exit 1
          fi

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  push-digests:
    name: Build and push ${{ matrix.image }} (untagged)
    needs: [guard, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: api, context: ., file: apps/api/Dockerfile }
          - { image: web, context: ., file: apps/web/Dockerfile }
          - { image: gateway, context: services/gateway, file: services/gateway/Dockerfile }
          - { image: vpn, context: services/vpn, file: services/vpn/Dockerfile }
          - { image: qbittorrent, context: services/qbittorrent, file: services/qbittorrent/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lower-case image name
        id: name
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/docker-seedbox-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Pushed by digest only: the image exists in the registry but carries no tag until the `tag` job below.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Tag all five images
    needs: [guard, push-digests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the tags
        env:
          KIND: ${{ needs.guard.outputs.kind }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$KIND" in
            edge) tags=(edge) ;;
            prerelease) v=${REF_NAME#v}; tags=("$v") ;;
            release) v=${REF_NAME#v}; tags=("$v" "${v%.*}" latest) ;;
            *) echo "::error::unexpected kind '$KIND'"; exit 1 ;;
          esac
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for image in api web gateway vpn qbittorrent; do
            test -s "digests/$image" || { echo "::error::no digest for $image"; exit 1; }
          done
          for image in api web gateway vpn qbittorrent; do
            ref="${REGISTRY}/${owner}/docker-seedbox-${image}"
            args=()
            for t in "${tags[@]}"; do args+=(-t "$ref:$t"); done
            docker buildx imagetools create "${args[@]}" "$ref@$(cat "digests/$image")"
          done

  attest:
    name: Attest ${{ matrix.image }}
    needs: [guard, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # sigstore signing identity
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, gateway, vpn, qbittorrent]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests
      - id: d
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/docker-seedbox-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat "digests/${{ matrix.image }}")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.d.outputs.name }}
          subject-digest: ${{ steps.d.outputs.digest }}
          push-to-registry: true
